# treefmt -- one-command, repo-wide formatting. Run `treefmt` from the repo root (the binary is in
# nixpkgs: `nix run nixpkgs#treefmt`, or `nix shell nixpkgs#treefmt`).
#
# This file is ALSO where nixfmt's options live: nixfmt has no native config file of its own
# (see https://github.com/NixOS/nixfmt/issues/77), so pinning its --width/--indent for agents and
# tooling is done here via treefmt. The values mirror the per-language formatter settings in
# modules/dev/langs.nix (4-space indent, 100-column width), so formatting from the editor and
# from the CLI agree.
#
# `nix fmt` runs THIS file: the flake's `formatter` output (see flake.nix) is a treefmt wrapper with
# nixfmt/shfmt/prettier on PATH. So `nix fmt` and a bare `treefmt` produce identical output, and either
# is fine.

[formatter.nixfmt]
    command  = "nixfmt"
    includes = ["*.nix"]
    options  = ["--width=100", "--indent=4", "--strict"]

[formatter.shfmt]
    command = "shfmt"
    includes = ["*.sh"]
    options = [
        "--indent=4",
        "--binary-next-line",
        "--case-indent",
        "--space-redirects",
        "--write",
    ]

# prettier reads .prettierrc.json in this repo for its options (tabWidth 4, printWidth 100).
[formatter.prettier]
    command = "prettier"
    excludes = ["flake.lock"]
    includes = [
        "*.json",
        "*.jsonc",
        "*.yaml",
        "*.yml",
        "*.css",
        "*.scss",
        "*.html",
        "*.js",
        "*.ts",
    ]
    options = ["--write"]
